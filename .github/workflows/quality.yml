name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The suites that touch the ledger and the hub room need a real database.
    # DATABASE_URL was already set below, which switched those suites on — but
    # nothing was ever listening on 5432, so `pnpm test` failed on every run and
    # the fifteen tests it was meant to enable had never executed anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/bingo_test
      DATABASE_URL_UNPOOLED: postgresql://test:test@127.0.0.1:5432/bingo_test
      AUTH_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_REFRESH_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      CLIENT_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Use HTTPS for public GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - name: Type checking
        run: pnpm typecheck
      - name: Database schema
        run: pnpm --filter @bingo/server db:migrate
      - name: Automated tests
        run: pnpm test
      - name: Production build
        run: pnpm build

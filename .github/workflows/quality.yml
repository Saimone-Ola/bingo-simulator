name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/bingo_test
      DATABASE_URL_UNPOOLED: postgresql://test:test@127.0.0.1:5432/bingo_test
      ACCESS_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      CLIENT_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type checking
        run: pnpm typecheck
      - name: Automated tests
        run: pnpm test
      - name: Production build
        run: pnpm build

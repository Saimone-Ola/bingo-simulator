# Render Blueprint.
#
# Connect this repository at https://dashboard.render.com/blueprints and Render
# provisions the game server and its database from this file. WebSockets work
# on every Render plan, including the free one - the caveat there is that a
# free instance sleeps after 15 minutes of inactivity and takes ~50 seconds to
# wake, which drops everyone in the hub.
#
# Two values are NOT set here on purpose:
#   AUTH_ACCESS_SECRET / AUTH_REFRESH_SECRET are generated by Render itself
#   (generateValue), so no secret ever exists in this repository.
#
# After the first deploy set CLIENT_ORIGINS to the Vercel URL of the front-end,
# and set VITE_API_URL on Vercel to this service's URL.

databases:
  - name: bingo-db
    databaseName: bingo
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: bingo-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Migrations run before the new instance takes traffic.
    preDeployCommand: node db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bingo-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: bingo-db
          property: connectionString
      - key: AUTH_ACCESS_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TTL_SECONDS
        value: '900'
      - key: AUTH_REFRESH_TTL_SECONDS
        value: '2592000'
      - key: WELCOME_BONUS_CREDITS
        value: '1000'
      - key: LOG_LEVEL
        value: info
      # Replace with the front-end origin once Vercel has assigned one.
      - key: CLIENT_ORIGINS
        sync: false

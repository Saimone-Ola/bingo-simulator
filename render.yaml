# Render Blueprint.
#
# Connect this repository at https://dashboard.render.com/blueprints and Render
# provisions the game server from this file.
#
# The database is deliberately NOT declared here. Render's free Postgres is
# deleted after 30 days, which is the opposite of what this project needs;
# `DATABASE_URL` is instead pasted in from a managed provider (see DEPLOY.md).
# Declaring it here would also mean two places owning the same connection.
#
# The two JWT secrets are generated by Render itself (`generateValue`), so no
# secret ever exists in this repository or passes through anyone's clipboard.

services:
  - type: web
    name: bingo-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `free` sleeps after 15 minutes of inactivity and takes ~50s to wake,
    # dropping everyone in the hub. Use `starter` for anything people actually
    # play on - see the note in DEPLOY.md.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Migrations run before the new instance takes traffic.
    preDeployCommand: node db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production

      # Pooled connection, used by the running server.
      - key: DATABASE_URL
        sync: false
      # Direct/session connection, used only by the migrator: a transaction
      # pooler cannot hold the advisory lock it takes.
      - key: DATABASE_URL_UNPOOLED
        sync: false

      - key: AUTH_ACCESS_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TTL_SECONDS
        value: '900'
      - key: AUTH_REFRESH_TTL_SECONDS
        value: '2592000'

      - key: WELCOME_BONUS_CREDITS
        value: '1000'
      - key: LOG_LEVEL
        value: info

      # The front-end origin, e.g. https://bingo-simulator.vercel.app
      # No trailing slash. CORS is closed by default: an origin that is not
      # listed here is refused on both the API and the matchmaking endpoints.
      - key: CLIENT_ORIGINS
        sync: false
